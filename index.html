<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To Do List">
<title>To Do List </title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F3F4F6;
    --card: #ffffff;
    --border: #E5E7EB;
    --text: #111827;
    --muted: #6B7280;
    --subtle: #9CA3AF;
    --row-hover: #F9FAFB;
    --topbar: #111827;
    --topbar-h: 54px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* TOP BAR */
  #topbar {
    background: var(--topbar);
    height: var(--topbar-h);
    padding: 0 16px 0 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #app-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  #progress-label { font-size: 11px; color: var(--subtle); font-weight: 500; }
  #save-status { font-size: 10px; font-weight: 600; display: flex; align-items: center; gap: 3px; }
  #save-status.saved { color: #10B981; }
  #save-status.saving { color: #F59E0B; }
  #save-status.error { color: #EF4444; }
  #view-toggle { display: flex; gap: 4px; }
  .view-btn {
    padding: 5px 11px; font-size: 12px; font-weight: 600; border-radius: 6px;
    border: none; background: transparent; color: var(--subtle); cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .view-btn.active { background: #fff; color: var(--topbar); }

  /* CONTENT */
  #content {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  /* GOAL GRID */
  #goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* GOAL CARD */
  .goal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .goal-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #F3F4F6;
  }
  .goal-header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .goal-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .goal-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .goal-subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .goal-pct { font-size: 22px; font-weight: 800; line-height: 1; text-align: right; flex-shrink: 0; margin-left: 10px; }
  .goal-pct-sub { font-size: 10px; color: var(--subtle); margin-top: 2px; text-align: right; }
  .progress-bar-track { height: 4px; background: #E5E7EB; border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }

  /* GOAL BODY */
  .goal-body { padding: 10px 6px 6px; }

  /* CATEGORY */
  .cat-block { border-radius: 8px; }
  .cat-block.dragging { opacity: 0.9; box-shadow: 0 10px 28px rgba(0,0,0,0.16); background: var(--card); }
  .cat-label-row {
    display: flex; align-items: center; gap: 4px;
    margin-top: 10px;
  }
  .cat-block:first-child .cat-label-row { margin-top: 0; }
  .cat-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); padding: 0 6px 0 4px; margin-bottom: 2px;
  }

  /* DRAG HANDLES */
  .drag-handle {
    flex-shrink: 0; background: none; border: none; cursor: grab;
    color: var(--subtle); opacity: 0.45; padding: 2px 4px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; font-size: 13px; line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; opacity: 0.9; }
  .cat-drag-handle { padding-left: 8px; }
  .task-drag-handle { margin-top: 2px; }

  /* TASK ROW */
  .task-row {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 8px 10px; border-radius: 6px; background: var(--card);
  }
  .task-row.dragging { box-shadow: 0 10px 28px rgba(0,0,0,0.16); border: 1px solid var(--border); }
  .task-check {
    flex-shrink: 0; margin-top: 2px; width: 20px; height: 20px; border-radius: 4px;
    border: 2px solid #D1D5DB; background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-appearance: none; appearance: none;
  }
  .task-check.done { background: var(--goal-color, #2563EB); border-color: var(--goal-color, #2563EB); }
  .task-content { flex: 1; min-width: 0; }
  .task-text {
    font-size: 13.5px; line-height: 1.4; margin-bottom: 6px;
    color: var(--text); word-break: break-word; cursor: text;
  }
  .task-text.done { color: var(--subtle); text-decoration: line-through; }
  .task-edit-row { margin-bottom: 6px; }
  .task-edit-input {
    width: 100%; font-size: 13.5px; font-family: inherit; color: var(--text);
    border: 1.5px solid var(--goal-color, #2563EB); border-radius: 5px;
    padding: 3px 6px; outline: none; background: #fff;
  }
  .task-edit, .task-remove {
    flex-shrink: 0; background: none; border: none; cursor: pointer;
    color: var(--subtle); padding: 4px; display: flex; align-items: center;
    opacity: 0.5; margin-top: 0;
  }
  .task-edit:hover, .task-remove:hover { opacity: 1; }

  /* DRAG PLACEHOLDER */
  .drag-placeholder {
    background: rgba(37,99,235,0.06);
    border: 1.5px dashed var(--border-mid, #D1D5DB);
    border-radius: 6px;
    margin: 2px 0;
    box-sizing: border-box;
  }

  /* DAY PICKER */
  .day-picker { display: flex; gap: 3px; flex-wrap: wrap; }
  .day-btn {
    padding: 2px 5px; font-size: 10px; font-weight: 600; border-radius: 4px;
    border: 1.5px solid #E5E7EB; background: #F9FAFB; color: var(--muted);
    cursor: pointer; font-family: inherit; letter-spacing: 0.02em; transition: all 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  .day-btn.active { background: var(--goal-color, #2563EB); border-color: var(--goal-color, #2563EB); color: #fff; }

  /* ADD TASK */
  .add-task-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-radius: 6px; cursor: pointer;
  }
  .add-task-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    cursor: pointer; color: var(--subtle); font-size: 12.5px; font-family: inherit;
    width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px;
    transition: color 0.12s;
  }
  .add-task-input {
    flex: 1; font-size: 13.5px; border: none; outline: none;
    background: transparent; color: var(--text); font-family: inherit;
  }
  .add-task-placeholder { width: 20px; height: 20px; border-radius: 4px; border: 2px solid #D1D5DB; flex-shrink: 0; }

  /* DAY VIEW */
  #day-selector { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .day-filter-btn {
    padding: 7px 14px; font-size: 13px; font-weight: 600; border-radius: 8px;
    border: 2px solid var(--border); background: var(--card); color: #374151;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  .day-filter-btn.active { border-color: var(--topbar); background: var(--topbar); color: #fff; }
  .day-task-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
    border-left: 4px solid var(--goal-color, #2563EB);
  }
  .day-task-goal-label { font-size: 11px; font-weight: 600; margin-top: 3px; }
  .day-task-unschedule {
    background: none; border: none; cursor: pointer; color: var(--subtle);
    font-size: 12px; padding: 2px 4px; flex-shrink: 0; align-self: center;
  }
  .empty-day {
    text-align: center; color: var(--subtle); font-size: 14px;
    padding: 48px 0; border: 2px dashed var(--border); border-radius: 12px;
  }

  /* CHECK ICON */
  .check-icon { display: none; }
  .task-check.done .check-icon { display: block; }

  /* TOAST */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    background: #111827; color: #fff; padding: 10px 12px 10px 16px; border-radius: 8px;
    display: flex; align-items: center; gap: 14px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); opacity: 0; pointer-events: none;
    transition: opacity 0.15s, transform 0.15s; z-index: 200; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast-undo {
    background: none; border: none; color: #60A5FA; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit; flex-shrink: 0; padding: 2px 4px;
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-left">
    <span id="app-title">To Do List</span>
    <span id="progress-label">0/0 done</span>
    <span id="save-status" class="saved">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Saved
    </span>
  </div>
  <div id="view-toggle">
    <button class="view-btn active" onclick="setView('goals')">All Goals</button>
    <button class="view-btn" onclick="setView('day')">By Day</button>
  </div>
</div>

<div id="content">
  <div id="goals-view">
    <div id="goals-grid"></div>
  </div>
  <div id="day-view" style="display:none">
    <div id="day-selector"></div>
    <div id="day-tasks"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'weekly-tracker-v1';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const INITIAL_GOALS = [
  {

      ]},
      { id:'c2', name:'Bachelor Party', tasks:[
        {id:'t3',text:'Review house options for Cartagena',done:false,days:[]},
        {id:'t4',text:'Book Cartagena flight',done:false,days:[]},
        {id:'t5',text:'Buy suit',done:false,days:[]}
      ]}
    ]
  },
  {
    id:'g2', label:'GOAL 2', title:'Reach <10% Body Fat',
    subtitle:'and build skills', color:'#059669', accent:'#D1FAE5',
    categories:[
      { id:'c3', name:'Health', tasks:[
        {id:'t6',text:'Gym: back, arms, abs',done:false,days:[]},
        {id:'t7',text:'Restart tracking macros',done:false,days:[]}
      ]},
      { id:'c4', name:'Study', tasks:[
        {id:'t8',text:'Read first Seneca essay',done:false,days:[]},
        {id:'t9',text:'Schedule Spanish class',done:false,days:[]}
      ]}
    ]
  },
  {
    id:'g3', label:'GOAL 3', title:'Land Defense Job in Europe',
    subtitle:'', color:'#7C3AED', accent:'#EDE9FE',
    categories:[
      { id:'c5', name:'Job Applications', tasks:[
        {id:'t10',text:'Apply to National Security Director, Microsoft',done:false,days:[]},
        {id:'t11',text:'Research other job search platforms; use AI',done:false,days:[]}
      ]},
      { id:'c6', name:'Professional Development', tasks:[
        {id:'t12',text:'Apply to Bucerius Global Governance Program, Aug 7–17, Hamburg',done:true,days:[]},
        {id:'t13',text:'Register for Atlantic-Brücke Young Leaders Conference, Aug 8–14, Denver',done:true,days:[]},
        {id:'t14',text:'Draft leave request for Madeline review',done:false,days:[]}
      ]},
      { id:'c7', name:'USNATO TDY', tasks:[
        {id:'t15',text:'Email Leigh Ann',done:true,days:[]},
        {id:'t16',text:'Email Alton',done:true,days:[]},
        {id:'t17',text:'Meet with Dot',done:false,days:[]}
      ]}
    ]
  },
  {
    id:'g4', label:'GOAL 4', title:'Strengthen Relationship with Borja',
    subtitle:'', color:'#DC2626', accent:'#FEE2E2',
    categories:[
      { id:'c8', name:'Therapy', tasks:[
        {id:'t18',text:'Complete relationship vision worksheet',done:false,days:[]},
        {id:'t19',text:'Call KP for quote for Saturday session',done:false,days:[]}
      ]},
      { id:'c9', name:'Apartment Move-In', tasks:[
        {id:'t20',text:'Ask to use Bene car for move-in',done:false,days:[]}
      ]},
      { id:'c10', name:'Life Planning', tasks:[
        {id:'t21',text:'Help create job tracker with Borja on Claude',done:false,days:[]},
        {id:'t22',text:'Plan summer leave with Borja',done:false,days:[]},
        {id:'t23',text:'Create budget with Borja',done:false,days:[]}
      ]}
    ]
  }
];

// ── State ──────────────────────────────────────────────────────────────────
let goals = [];
let currentView = 'goals';
let selectedDay = DAYS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
let saveTimer = null;

// Collision-proof id: not a session-local counter, so ids stay unique even
// across page reloads (a plain incrementing counter reset to the same
// starting value every reload, which produced duplicate ids and let edits
// on one goal's task silently apply to an unrelated task sharing that id).
function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
}

// ── Persistence ────────────────────────────────────────────────────────────
// Older saves may have a single `day` field instead of a `days` array
// (single-day scheduling); normalize on load so both shapes work.
function migrateTask(t) {
  if (!Array.isArray(t.days)) {
    t.days = t.day ? [t.day] : [];
  }
  delete t.day;
  return t;
}

function normalize(loadedGoals) {
  loadedGoals.forEach(g => g.categories.forEach(c => c.tasks.forEach(migrateTask)));
  return loadedGoals;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { goals = normalize(JSON.parse(raw)); return; }
  } catch(e) {}
  goals = normalize(JSON.parse(JSON.stringify(INITIAL_GOALS)));
}

function scheduleSave() {
  setSaveStatus('saving');
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
      setSaveStatus('saved');
    } catch(e) {
      setSaveStatus('error');
    }
  }, 400);
}

function setSaveStatus(status) {
  const el = document.getElementById('save-status');
  el.className = 'saved'; // reset
  if (status === 'saving') {
    el.className = 'saving';
    el.innerHTML = 'Saving…';
  } else if (status === 'error') {
    el.className = 'error';
    el.innerHTML = '⚠ Save failed';
  } else {
    el.className = 'saved';
    el.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Saved`;
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function allTasks() { return goals.flatMap(g => g.categories.flatMap(c => c.tasks)); }
function updateProgress() {
  const all = allTasks();
  document.getElementById('progress-label').textContent = `${all.filter(t=>t.done).length}/${all.length} done`;
}

function findTask(taskId) {
  for (const g of goals) for (const c of g.categories) for (const t of c.tasks) if (t.id===taskId) return t;
  return null;
}
function findCatByTask(taskId) {
  for (const g of goals) for (const c of g.categories) if (c.tasks.find(t=>t.id===taskId)) return c;
  return null;
}

// A tiny helper that wires up an <input> used for inline add/edit so that
// Enter commits, Escape cancels, and blur commits (for taps outside the
// field on mobile) — while guaranteeing only ONE of commit/cancel ever
// fires. Without this guard, pressing Escape still let the delayed blur
// handler fire afterwards and silently re-commit the value.
function wireInlineEditor(input, { onCommit, onCancel }) {
  let settled = false;
  const commit = () => {
    if (settled) return;
    settled = true;
    onCommit(input.value);
  };
  const cancel = () => {
    if (settled) return;
    settled = true;
    onCancel();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', () => setTimeout(commit, 150));
}

// ── Toast (undo) ───────────────────────────────────────────────────────────
let toastTimer = null;
function showUndoToast(message, onUndo) {
  const el = document.getElementById('toast');
  clearTimeout(toastTimer);
  el.innerHTML = `<span class="toast-text">${escHtml(message)}</span><button class="toast-undo" type="button">Undo</button>`;
  el.classList.add('show');
  el.querySelector('.toast-undo').onclick = () => {
    el.classList.remove('show');
    clearTimeout(toastTimer);
    onUndo();
  };
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

// ── Actions ────────────────────────────────────────────────────────────────
function toggleTask(taskId) {
  const t = findTask(taskId);
  if (!t) return;
  t.done = !t.done;
  scheduleSave();
  render();
}

function removeTask(taskId) {
  const c = findCatByTask(taskId);
  const t = findTask(taskId);
  if (!c || !t) return;
  const index = c.tasks.findIndex(x => x.id === taskId);
  c.tasks.splice(index, 1);
  scheduleSave();
  render();
  showUndoToast(`Removed "${t.text}"`, () => {
    c.tasks.splice(Math.min(index, c.tasks.length), 0, t);
    scheduleSave();
    render();
  });
}

function addTask(goalId, catId, text) {
  const g = goals.find(g=>g.id===goalId);
  if (!g) return;
  const c = g.categories.find(c=>c.id===catId);
  if (!c) return;
  c.tasks.push({id:uid('t'), text, done:false, days:[]});
  scheduleSave();
  render();
}

function editTaskText(taskId, text) {
  const t = findTask(taskId);
  if (!t) return;
  t.text = text;
  scheduleSave();
  render();
}

function toggleTaskDay(taskId, day) {
  const t = findTask(taskId);
  if (!t) return;
  const idx = t.days.indexOf(day);
  if (idx >= 0) t.days.splice(idx, 1);
  else t.days.push(day);
  scheduleSave();
  render();
}

function unscheduleTaskDay(taskId, day) {
  const t = findTask(taskId);
  if (!t) return;
  const idx = t.days.indexOf(day);
  if (idx >= 0) t.days.splice(idx, 1);
  scheduleSave();
  render();
}

function reorderTasks(catId, orderedTaskIds) {
  const cat = goals.flatMap(g => g.categories).find(c => c.id === catId);
  if (!cat) return;
  const byId = new Map(cat.tasks.map(t => [t.id, t]));
  const reordered = orderedTaskIds.map(id => byId.get(id)).filter(Boolean);
  if (reordered.length === cat.tasks.length) {
    cat.tasks = reordered;
    scheduleSave();
  }
}

function reorderCategories(goalId, orderedCatIds) {
  const g = goals.find(g => g.id === goalId);
  if (!g) return;
  const byId = new Map(g.categories.map(c => [c.id, c]));
  const reordered = orderedCatIds.map(id => byId.get(id)).filter(Boolean);
  if (reordered.length === g.categories.length) {
    g.categories = reordered;
    scheduleSave();
  }
}

// ── View switching ─────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.getElementById('goals-view').style.display = v==='goals' ? '' : 'none';
  document.getElementById('day-view').style.display = v==='day' ? '' : 'none';
  document.querySelectorAll('.view-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0&&v==='goals')||(i===1&&v==='day'));
  });
  if (v==='day') renderDayView();
}

// ── Render helpers ─────────────────────────────────────────────────────────
function checkSVG() {
  return `<svg class="check-icon" width="10" height="8" viewBox="0 0 10 8" fill="none">
    <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function editSVG() {
  return `<svg width="13" height="13" viewBox="0 0 14 14" fill="none">
    <path d="M9.5 1.5L12.5 4.5L4.5 12.5L1 13L1.5 9.5L9.5 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderDayPicker(task, goalColor) {
  return `<div class="day-picker">
    ${DAYS.map(d => `<button class="day-btn${task.days.includes(d)?' active':''}" style="--goal-color:${goalColor}"
      onclick="toggleTaskDay('${task.id}','${d}')">${d}</button>`).join('')}
  </div>`;
}

function renderTask(task, goalColor) {
  return `<div class="task-row" data-id="${task.id}">
    <button class="drag-handle task-drag-handle" aria-label="Reorder task">⠿</button>
    <button class="task-check${task.done?' done':''}" style="--goal-color:${goalColor}"
      onclick="toggleTask('${task.id}')">${checkSVG()}</button>
    <div class="task-content">
      <div class="task-text${task.done?' done':''}" ondblclick="activateEditTask(this,'${task.id}')">${escHtml(task.text)}</div>
      ${renderDayPicker(task, goalColor)}
    </div>
    <button class="task-edit" onclick="activateEditTask(this,'${task.id}')" aria-label="Edit task">${editSVG()}</button>
    <button class="task-remove" onclick="removeTask('${task.id}')" aria-label="Remove task">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>`;
}

function activateEditTask(el, taskId) {
  const task = findTask(taskId);
  if (!task) return;
  const row = el.closest('.task-row');
  const textEl = row.querySelector('.task-text');
  const wrapper = document.createElement('div');
  wrapper.className = 'task-edit-row';
  wrapper.innerHTML = `<input class="task-edit-input" autocomplete="off">`;
  textEl.replaceWith(wrapper);
  const input = wrapper.querySelector('input');
  input.value = task.text;
  input.focus();
  input.select();
  wireInlineEditor(input, {
    onCommit: (value) => {
      const text = value.trim();
      if (text) editTaskText(taskId, text);
      else render();
    },
    onCancel: () => render()
  });
}

function renderAddTask(goalId, catId, goalColor) {
  return `<button class="add-task-btn" style="color:var(--subtle)"
    onmouseenter="this.style.color='${goalColor}'" onmouseleave="this.style.color=''"
    onclick="activateAddTask(this,'${goalId}','${catId}')">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M6 1V11M1 6H11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    Add task
  </button>`;
}

function activateAddTask(btn, goalId, catId) {
  const parent = btn.parentElement;
  const wrapper = document.createElement('div');
  wrapper.className = 'add-task-row';
  wrapper.innerHTML = `<div class="add-task-placeholder"></div>
    <input class="add-task-input" placeholder="New task…" autocomplete="off">`;
  parent.replaceChild(wrapper, btn);
  const input = wrapper.querySelector('input');
  input.focus();
  wireInlineEditor(input, {
    onCommit: (value) => {
      const text = value.trim();
      if (text) addTask(goalId, catId, text);
      else render();
    },
    onCancel: () => render()
  });
}

function renderGoalCard(goal) {
  const tasks = goal.categories.flatMap(c=>c.tasks);
  const done = tasks.filter(t=>t.done).length;
  const pct = tasks.length===0 ? 0 : Math.round(done/tasks.length*100);

  const catsHtml = goal.categories.map(cat => `
    <div class="cat-block" data-id="${cat.id}">
      <div class="cat-label-row">
        <button class="drag-handle cat-drag-handle" aria-label="Reorder category">⠿</button>
        <div class="cat-label">${escHtml(cat.name)}</div>
      </div>
      <div class="task-list" data-cat-id="${cat.id}">
        ${cat.tasks.map(t=>renderTask(t,goal.color)).join('')}
      </div>
      ${renderAddTask(goal.id, cat.id, goal.color)}
    </div>
  `).join('');

  return `<div class="goal-card">
    <div class="goal-header" style="background:${goal.accent}">
      <div class="goal-header-row">
        <div>
          <span class="goal-label" style="color:${goal.color}">${escHtml(goal.label)}</span>
          <div class="goal-title">${escHtml(goal.title)}</div>
          ${goal.subtitle ? `<div class="goal-subtitle">${escHtml(goal.subtitle)}</div>` : ''}
        </div>
        <div>
          <div class="goal-pct" style="color:${goal.color}">${pct}%</div>
          <div class="goal-pct-sub">${done}/${tasks.length} done</div>
        </div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%;background:${goal.color}"></div>
      </div>
    </div>
    <div class="goal-body">
      <div class="cat-list" data-goal-id="${goal.id}">${catsHtml}</div>
    </div>
  </div>`;
}

function renderDayView() {
  // Day selector
  const sel = document.getElementById('day-selector');
  sel.innerHTML = DAYS.map(d =>
    `<button class="day-filter-btn${d===selectedDay?' active':''}" onclick="selectDay('${d}')">${d}</button>`
  ).join('');

  // Filtered tasks
  const container = document.getElementById('day-tasks');
  const items = [];
  goals.forEach(g => g.categories.forEach(c => c.tasks.forEach(t => {
    if (t.days.includes(selectedDay)) items.push({...t, goalTitle:g.title, goalColor:g.color, goalId:g.id});
  })));

  if (items.length===0) {
    container.innerHTML = `<div class="empty-day">No tasks scheduled for ${selectedDay}.</div>`;
    return;
  }

  container.innerHTML = items.map(t => `
    <div class="day-task-item" style="--goal-color:${t.goalColor};border-left-color:${t.goalColor}">
      <button class="task-check${t.done?' done':''}" style="--goal-color:${t.goalColor};flex-shrink:0;margin-top:2px"
        onclick="toggleTask('${t.id}')">${checkSVG()}</button>
      <div style="flex:1;min-width:0">
        <div class="task-text${t.done?' done':''}" style="margin-bottom:2px">${escHtml(t.text)}</div>
        <div class="day-task-goal-label" style="color:${t.goalColor}">${escHtml(t.goalTitle)}</div>
      </div>
      <button class="day-task-unschedule" onclick="unscheduleTaskDay('${t.id}','${selectedDay}')" title="Remove from this day">✕</button>
    </div>
  `).join('');
}

function selectDay(d) {
  selectedDay = d;
  renderDayView();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Drag-and-drop reordering ─────────────────────────────────────────────
// Uses Pointer Events (not the HTML5 drag-and-drop API) because native
// drag-and-drop isn't supported on iOS Safari — Pointer Events work
// identically for mouse, touch, and pen, which matters since this app is
// meant to be used as an iPhone home-screen app.
function startDrag(startEvent, item, container, itemSelector, onCommit) {
  startEvent.preventDefault();
  const pointerId = startEvent.pointerId;
  const rect = item.getBoundingClientRect();
  const offsetX = startEvent.clientX - rect.left;
  const offsetY = startEvent.clientY - rect.top;

  const placeholder = document.createElement('div');
  placeholder.className = 'drag-placeholder';
  placeholder.style.height = rect.height + 'px';
  item.parentNode.insertBefore(placeholder, item);

  item.classList.add('dragging');
  item.style.width = rect.width + 'px';
  item.style.position = 'fixed';
  item.style.left = rect.left + 'px';
  item.style.top = rect.top + 'px';
  item.style.zIndex = '1000';
  item.style.pointerEvents = 'none';
  document.body.appendChild(item);

  try { item.setPointerCapture(pointerId); } catch(e) {}

  function siblings() {
    return Array.from(container.querySelectorAll(':scope > ' + itemSelector));
  }

  function onMove(e) {
    if (e.pointerId !== pointerId) return;
    item.style.left = (e.clientX - offsetX) + 'px';
    item.style.top = (e.clientY - offsetY) + 'px';
    const y = e.clientY;
    let target = null;
    for (const sib of siblings()) {
      const r = sib.getBoundingClientRect();
      if (y < r.top + r.height / 2) { target = sib; break; }
    }
    if (target) container.insertBefore(placeholder, target);
    else container.appendChild(placeholder);
  }

  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    container.insertBefore(item, placeholder);
    placeholder.remove();
    item.classList.remove('dragging');
    item.style.position = '';
    item.style.left = '';
    item.style.top = '';
    item.style.width = '';
    item.style.zIndex = '';
    item.style.pointerEvents = '';
    const ids = siblings().map(el => el.dataset.id);
    onCommit(ids);
    render();
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

document.addEventListener('pointerdown', (e) => {
  const taskHandle = e.target.closest('.task-drag-handle');
  if (taskHandle) {
    const row = taskHandle.closest('.task-row');
    const list = row.closest('.task-list');
    startDrag(e, row, list, '.task-row', (ids) => reorderTasks(list.dataset.catId, ids));
    return;
  }
  const catHandle = e.target.closest('.cat-drag-handle');
  if (catHandle) {
    const block = catHandle.closest('.cat-block');
    const list = block.closest('.cat-list');
    startDrag(e, block, list, '.cat-block', (ids) => reorderCategories(list.dataset.goalId, ids));
  }
});

// ── Main render ────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('goals-grid');
  grid.innerHTML = goals.map(renderGoalCard).join('');
  updateProgress();
  if (currentView==='day') renderDayView();
}

// ── Boot ───────────────────────────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
